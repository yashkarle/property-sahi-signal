[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-sahi-signal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Validation & settings
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # AWS
    "boto3==1.35.81",
    "botocore==1.35.81",

    # OpenSearch
    "opensearch-py==2.7.1",
    "requests-aws4auth==1.3.1",

    # Cache
    "redis[asyncio]==5.2.1",

    # ML / Bayesian
    "pymc==5.18.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",

    # PDF report generation
    "weasyprint==62.3",
    "jinja2==3.1.4",

    # Utilities
    "python-multipart==0.0.12",
    "python-jose[cryptography]==3.3.0",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "geopy==2.4.1",
    "shapely==2.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers[postgresql]==4.8.1",
    "factory-boy==3.3.1",
    "httpx==0.27.2",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
