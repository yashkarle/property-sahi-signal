[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "property-sahi-signal-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.14.0",

    # Validation & settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # AWS
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # OpenSearch
    "opensearch-py[async]>=2.7.0",
    "aiohttp>=3.9.0",
    "requests-aws4auth>=1.3.0",

    # Cache
    "redis[asyncio]>=5.2.0",

    # Data
    "pandas>=1.5.0",
    "jinja2>=3.1.0",

    # Utilities
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "geopy>=2.4.0",
    "shapely>=2.0.0",

    # Web scraping (for url ingest endpoint)
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
ml = [
    # pymc omitted: not imported at runtime (model runs via remote dhub service),
    # and its llvmlite dep requires cmake which is not available in all envs.
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "weasyprint>=62.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgresql]>=4.8.0",
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
